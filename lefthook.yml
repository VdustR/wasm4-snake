# Lefthook configuration for git hooks
# Install: https://github.com/evilmartians/lefthook#install

pre-commit:
  parallel: false
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --check
      stage_fixed: true

    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --target wasm32-unknown-unknown -- -D warnings

    web-lint-staged:
      root: "web/"
      glob: "web/**/*.{js,ts,astro,json,md,css}"
      run: pnpm exec lint-staged

    web-typecheck:
      root: "web/"
      glob: "web/**/*.{ts,astro}"
      run: pnpm exec astro check
